<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AI 리터러시 윤리와 저작권 · OX 골든벨</title>
<link rel="stylesheet" as="style" crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --ink:#16161D; --ink2:#2E2E3D; --paper:#FFFFFF;
    --tint:#F3F3F7; --tint2:#E8E8F0; --line:#D8D8E2; --gray:#6E6E7A;
    --accent:#FF4D2E; --amber:#F2A20C; --green:#12A594; --purple:#6C4BF6;
    --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,
           "Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--font); background:var(--ink); color:var(--ink);
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:24px 16px; line-height:1.5; overflow-x:hidden;
  }
  .app{width:100%; max-width:760px; position:relative; z-index:1;}

  .card{
    background:var(--paper); border-radius:20px; padding:38px 38px 34px;
    box-shadow:0 24px 60px rgba(0,0,0,.35); position:relative;
  }
  @media(max-width:600px){ .card{padding:24px 20px 22px; border-radius:16px;} }

  .lamps{display:flex; gap:9px; margin-bottom:22px;}
  .lamp{width:13px;height:13px;border-radius:50%;}
  .lamp.g{background:var(--green);} .lamp.a{background:var(--amber);} .lamp.r{background:var(--accent);}

  .eyebrow{font-weight:800; font-size:15px; letter-spacing:.08em; color:var(--accent); margin-bottom:12px;}
  h1{font-size:34px; font-weight:900; margin:0 0 14px; letter-spacing:-.02em; line-height:1.25;}
  @media(max-width:600px){ h1{font-size:26px;} }
  .lede{font-size:17px; font-weight:600; color:var(--gray); margin:0 0 24px;}

  .facts{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:22px;}
  .fact{background:var(--tint); border:1px solid var(--tint2); border-radius:12px; padding:16px 14px;}
  .fact b{display:block; font-size:26px; font-weight:900; color:var(--purple); margin-bottom:4px;}
  .fact span{font-size:15px; font-weight:600; color:var(--gray);}
  @media(max-width:600px){ .facts{grid-template-columns:1fr; gap:8px;}
    .fact{display:flex; align-items:baseline; gap:10px; padding:12px 14px;}
    .fact b{font-size:21px; margin:0;} }

  /* 옵션 스위치 */
  .opts{display:flex; gap:10px; margin-bottom:20px;}
  .opt{
    flex:1; display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--tint); border:1px solid var(--tint2); border-radius:12px;
    padding:13px 16px; cursor:pointer; user-select:none;
  }
  .opt .t{font-size:16px; font-weight:800; color:var(--ink2);}
  .sw{width:44px; height:26px; border-radius:99px; background:var(--line); position:relative; transition:.18s; flex:none;}
  .sw::after{content:""; position:absolute; top:3px; left:3px; width:20px; height:20px;
             border-radius:50%; background:#fff; transition:.18s; box-shadow:0 1px 3px rgba(0,0,0,.25);}
  .opt.on .sw{background:var(--green);} .opt.on .sw::after{transform:translateX(18px);}
  @media(max-width:600px){ .opts{flex-direction:column;} }

  .btn{
    display:block; width:100%; border:0; border-radius:14px; cursor:pointer;
    font-family:var(--font); font-size:19px; font-weight:800;
    padding:19px; background:var(--ink); color:#fff; transition:transform .06s, opacity .15s;
  }
  .btn:hover{opacity:.88;} .btn:active{transform:translateY(1px);}
  .btn.ghost{background:var(--tint); color:var(--ink2); border:1px solid var(--line);}
  .btn.amber{background:var(--amber); color:var(--ink);}
  .btn-row{display:flex; gap:10px; margin-top:12px;}
  .btn-row .btn{margin:0;}

  .hint{margin-top:15px; font-size:15px; font-weight:600; color:#A0A0AC; text-align:center;}
  .hint kbd{font-family:var(--font); font-weight:800; background:var(--tint); color:var(--ink2);
    border:1px solid var(--line); border-bottom-width:2px; border-radius:6px; padding:2px 7px; font-size:14px; margin:0 2px;}

  /* ── 퀴즈 상단 ─────────────────────────────── */
  .track{height:5px; background:var(--tint2); border-radius:99px; overflow:hidden; margin-bottom:18px;}
  .fill{height:100%; width:0; background:var(--purple); border-radius:99px; transition:width .3s;}

  .bar-top{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:12px;}
  .qcount{font-size:17px; font-weight:900; color:var(--ink); flex:none;}
  .qcount em{color:var(--gray); font-style:normal; font-weight:700; font-size:15px;}
  .mid{display:flex; gap:7px; align-items:center; flex:1; justify-content:center;}
  .combo{
    font-size:14px; font-weight:900; padding:5px 12px; border-radius:999px;
    background:var(--amber); color:var(--ink); opacity:0; transform:scale(.6); transition:.2s;
  }
  .combo.on{opacity:1; transform:scale(1);}
  .combo.hot{background:var(--accent); color:#fff; box-shadow:0 0 0 0 rgba(255,77,46,.55); animation:hot 1.1s infinite;}
  @keyframes hot{70%{box-shadow:0 0 0 12px rgba(255,77,46,0);}100%{box-shadow:0 0 0 0 rgba(255,77,46,0);}}
  .pts{font-size:17px; font-weight:900; color:var(--green); flex:none;}
  .pts em{font-style:normal; font-weight:700; font-size:14px; color:var(--gray);}

  /* 타이머 */
  .timer{display:flex; align-items:center; gap:12px; margin-bottom:24px;}
  .tbar{flex:1; height:12px; background:var(--tint2); border-radius:99px; overflow:hidden;}
  .tfill{height:100%; width:100%; background:var(--green); border-radius:99px; transition:background .3s;}
  .tnum{font-size:22px; font-weight:900; color:var(--green); min-width:34px; text-align:right; font-variant-numeric:tabular-nums;}
  .timer.warn .tfill{background:var(--amber);} .timer.warn .tnum{color:var(--amber);}
  .timer.crit .tfill{background:var(--accent);} .timer.crit .tnum{color:var(--accent); animation:blink .5s infinite;}
  @keyframes blink{50%{opacity:.35;}}
  .timer.off{display:none;}

  .tag{font-size:14px; font-weight:800; padding:5px 11px; border-radius:999px; background:var(--tint); color:var(--gray);}
  .tag[data-t="AI 리터러시"]{background:#F0EDFF; color:var(--purple);}
  .tag[data-t="윤리·개인정보"]{background:#E9F8F5; color:var(--green);}
  .tag[data-t="저작권"]{background:#FFF4E6; color:#B87708;}

  .qhead{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
  .qtext{font-size:24px; font-weight:800; line-height:1.5; margin:0 0 26px; letter-spacing:-.01em; min-height:76px;}
  @media(max-width:600px){ .qtext{font-size:20px; min-height:0; margin-bottom:20px;} }
  .qtext.enter{animation:slideIn .26s ease-out;}
  @keyframes slideIn{from{opacity:0; transform:translateX(22px);}to{opacity:1; transform:none;}}

  /* ── OX ────────────────────────────────────── */
  .ox{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .ox button{font-family:var(--font); cursor:pointer; border-radius:16px; padding:26px 0 22px;
    background:var(--paper); border:2px solid var(--line); transition:.14s;}
  .ox button .mark{display:block; font-size:44px; font-weight:900; line-height:1; margin-bottom:6px;}
  .ox button .lbl{display:block; font-size:15px; font-weight:700; color:var(--gray);}
  .ox button[data-v="O"] .mark{color:var(--green);}
  .ox button[data-v="X"] .mark{color:var(--accent);}
  .ox button:hover:not(:disabled){border-color:var(--ink); transform:translateY(-2px);}
  .ox button:disabled{cursor:default;}
  .ox button.dim{opacity:.35;}
  .ox button.right{border-color:var(--green); background:#E9F8F5; animation:pop .3s;}
  .ox button.wrong{border-color:var(--accent); background:#FFF0EC;}
  @keyframes pop{0%{transform:scale(1);}45%{transform:scale(1.06);}100%{transform:scale(1);}}

  .card.shake{animation:shake .34s;}
  @keyframes shake{10%,90%{transform:translateX(-3px);}20%,80%{transform:translateX(6px);}
    30%,50%,70%{transform:translateX(-9px);}40%,60%{transform:translateX(9px);}}
  .card.flash-ok{animation:fok .5s;} @keyframes fok{0%{box-shadow:0 24px 60px rgba(0,0,0,.35),0 0 0 0 rgba(18,165,148,.7);}100%{box-shadow:0 24px 60px rgba(0,0,0,.35),0 0 0 22px rgba(18,165,148,0);}}
  @media(prefers-reduced-motion:reduce){ .card.shake,.card.flash-ok,.qtext.enter,.ox button.right{animation:none;} }

  /* ── 해설 ──────────────────────────────────── */
  .fb{margin-top:20px; border-radius:14px; padding:20px 22px; display:none;}
  .fb.show{display:block; animation:rise .22s ease-out;}
  @keyframes rise{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  .fb.ok{background:#E9F8F5; border:1px solid #B7E6DD;}
  .fb.no{background:#FFF0EC; border:1px solid #FFD0C4;}
  .fb .verdict{font-size:19px; font-weight:900; margin-bottom:7px;}
  .fb.ok .verdict{color:var(--green);} .fb.no .verdict{color:var(--accent);}
  .fb .why{font-size:17px; font-weight:600; color:var(--ink2); line-height:1.55;}

  /* ── 결과 ──────────────────────────────────── */
  .score{background:var(--ink); border-radius:16px; padding:30px; text-align:center; color:#fff; margin-bottom:14px;}
  .score .num{font-size:66px; font-weight:900; line-height:1; letter-spacing:-.03em;}
  .score .num small{font-size:26px; font-weight:800; color:#8A8AA0;}
  .score .grade{font-size:19px; font-weight:800; color:var(--amber); margin-top:12px;}
  .score .msg{font-size:16px; font-weight:600; color:#B4B4C8; margin-top:8px; line-height:1.55;}
  .score .streak{font-size:15px; font-weight:700; color:#8A8AA0; margin-top:10px;}

  .bytopic{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:26px;}
  .bt{background:var(--tint); border:1px solid var(--tint2); border-radius:12px; padding:14px;}
  .bt .t{font-size:14px; font-weight:800; color:var(--gray); margin-bottom:5px;}
  .bt .s{font-size:22px; font-weight:900;}
  @media(max-width:600px){ .bytopic{grid-template-columns:1fr;}
    .bt{display:flex; justify-content:space-between; align-items:center; padding:11px 14px;}
    .bt .t,.bt .s{margin:0;} .bt .s{font-size:18px;} }

  h2.rev{font-size:19px; font-weight:900; margin:0 0 14px;}
  .miss{border:1px solid var(--line); border-left:4px solid var(--accent);
        border-radius:10px; padding:16px 18px; margin-bottom:10px; background:var(--paper);}
  .miss .q{font-size:17px; font-weight:800; line-height:1.5; margin-bottom:9px;}
  .miss .a{font-size:15px; font-weight:700; color:var(--gray);}
  .miss .a b{color:var(--green); font-weight:900;}
  .miss .a i{color:var(--accent); font-weight:900; font-style:normal;}
  .miss .w{font-size:16px; font-weight:600; color:var(--ink2); margin-top:8px; line-height:1.55;}
  .allright{background:#E9F8F5; border:1px solid #B7E6DD; border-radius:14px;
            padding:22px; font-size:17px; font-weight:700; color:var(--green); text-align:center;}
  .foot{margin-top:22px; font-size:14px; font-weight:600; color:#7A7A88; text-align:center;}

  #fx{position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:99; display:none;}
  .hidden{display:none;}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="app">

  <!-- 시작 -->
  <section id="intro" class="card">
    <div class="lamps"><i class="lamp g"></i><i class="lamp a"></i><i class="lamp r"></i></div>
    <div class="eyebrow">직무소양교육 · 마무리 골든벨</div>
    <h1>AI 리터러시 윤리와 저작권<br>OX 20문항</h1>
    <p class="lede">한 문항 15초입니다. 맞으면 딩동댕, 틀리면 띠. 연속으로 맞히면 콤보가 쌓입니다.</p>
    <div class="facts">
      <div class="fact"><b>20</b><span>문항 · OX</span></div>
      <div class="fact"><b>15초</b><span>문항당 제한시간</span></div>
      <div class="fact"><b>즉시</b><span>정답과 해설 확인</span></div>
    </div>
    <div class="opts">
      <div class="opt on" id="optSound"><span class="t">효과음</span><span class="sw"></span></div>
      <div class="opt on" id="optTimer"><span class="t">제한시간</span><span class="sw"></span></div>
    </div>
    <button class="btn" id="start">시작하기</button>
    <p class="hint">키보드로도 답할 수 있습니다 &nbsp;<kbd>O</kbd> <kbd>X</kbd> <kbd>Enter</kbd></p>
  </section>

  <!-- 문제 -->
  <section id="quiz" class="card hidden">
    <div class="track"><div class="fill" id="fill"></div></div>
    <div class="bar-top">
      <div class="qcount"><span id="qnum">1</span> <em>/ 20</em></div>
      <div class="mid"><span class="combo" id="combo"></span></div>
      <div class="pts"><span id="pts">0</span><em> 점</em></div>
    </div>
    <div class="timer" id="timer">
      <div class="tbar"><div class="tfill" id="tfill"></div></div>
      <div class="tnum" id="tnum">15</div>
    </div>
    <div class="qhead"><span class="tag" id="qtag">AI 리터러시</span></div>
    <p class="qtext" id="qtext"></p>
    <div class="ox">
      <button data-v="O"><span class="mark">O</span><span class="lbl">맞다</span></button>
      <button data-v="X"><span class="mark">X</span><span class="lbl">아니다</span></button>
    </div>
    <div class="fb" id="fb">
      <div class="verdict" id="verdict"></div>
      <div class="why" id="why"></div>
    </div>
    <button class="btn hidden" id="next" style="margin-top:16px">다음 문제</button>
  </section>

  <!-- 결과 -->
  <section id="result" class="card hidden">
    <div class="eyebrow">결과</div>
    <div class="score">
      <div class="num"><span id="sc">0</span><small> / 20</small></div>
      <div class="grade" id="grade"></div>
      <div class="msg" id="msg"></div>
      <div class="streak" id="streakLine"></div>
    </div>
    <div class="bytopic" id="bytopic"></div>
    <h2 class="rev" id="revTitle">다시 볼 문항</h2>
    <div id="misses"></div>
    <div class="btn-row">
      <button class="btn ghost" id="again">처음부터 다시</button>
      <button class="btn amber hidden" id="retry">틀린 것만 다시</button>
    </div>
    <p class="foot">판단이 애매한 회색지대에서는 스스로 결론 내리지 말고 담당 부서에 확인하세요.</p>
  </section>

</div>

<script>
/* ══ 문항 ═════════════════════════════════════════════════ */
const QUESTIONS = [
  {q:"생성형 AI는 정답을 찾아 주는 것이 아니라, 그럴듯한 다음 말을 예측해 만들어 낸다.",
   a:"O", t:"AI 리터러시", why:"생성형 AI의 작동 원리 그 자체입니다. 사실을 조회하는 것이 아니라 확률이 가장 높은 다음 말을 이어붙입니다."},
  {q:"AI가 제시한 통계 수치는 출처가 함께 나오면 그대로 인용해도 된다.",
   a:"X", t:"AI 리터러시", why:"출처도 지어낼 수 있습니다. 링크가 열리더라도 그 내용이 실제로 그 주장을 담고 있는지 원문으로 확인해야 합니다."},
  {q:"이름과 연락처를 지우면 그 자료는 언제나 익명정보가 된다.",
   a:"X", t:"윤리·개인정보", why:"남은 항목의 조합으로 특정될 수 있으면 여전히 개인정보입니다. 부서+직급+입사연도만으로도 한 사람이 지목되곤 합니다."},
  {q:"배송을 위해 받은 고객 연락처로 마케팅 문자를 보내려면 별도의 근거가 필요하다.",
   a:"O", t:"윤리·개인정보", why:"수집 목적(배송) 외 이용에 해당합니다. 목적을 벗어난 활용에는 별도의 처리 근거가 필요합니다."},
  {q:"저작권은 등록하거나 ⓒ 표시를 해야만 발생한다.",
   a:"X", t:"저작권", why:"등록이나 표시와 무관하게 창작과 동시에 자동으로 발생합니다. 표시가 없다고 자유이용 자료인 것은 아닙니다."},
  {q:"출처만 정확히 밝히면 어떤 저작물이든 자유롭게 쓸 수 있다.",
   a:"X", t:"저작권", why:"출처표시는 인용의 여러 조건 중 하나일 뿐, 이용 허락과는 별개입니다."},
  {q:"비영리 목적이면 저작권자의 허락 없이 사용할 수 있다.",
   a:"X", t:"저작권", why:"비영리라도 권리자의 허락이 필요할 수 있습니다. 사내 교육·비영리 행사도 이용 조건을 먼저 확인해야 합니다."},
  {q:"CC BY-NC 이미지는 회사 제품 홍보물에 사용할 수 있다.",
   a:"X", t:"저작권", why:"NC는 비영리 조건입니다. 회사 제품 홍보물은 상업적 이용에 해당하므로 조건을 벗어납니다."},
  {q:"무료로 배포되는 폰트라도 상업적 사용 범위는 따로 확인해야 한다.",
   a:"O", t:"저작권", why:"'개인 사용 무료'와 '상업적 사용 무료'는 다릅니다. 인쇄물만 가능, 임베딩 불가 같은 조건도 개별로 확인해야 합니다."},
  {q:"AI가 만든 결과물이라면 어떤 경우에도 저작권이 인정되지 않는다.",
   a:"X", t:"저작권", why:"사람의 창작적 기여 정도에 따라 달라집니다. AI를 썼다는 사실만으로 모든 권리가 부정되는 것은 아닙니다."},
  {q:"AI에 자료를 넣을 때는 개인정보를 지우는 것보다 다른 값으로 치환하는 편이 유용하다.",
   a:"O", t:"윤리·개인정보", why:"안전하면서도 쓸모를 남기는 것이 요령입니다. 과하게 지우면 결국 원문을 넣게 됩니다."},
  {q:"회사가 승인하지 않은 외부 AI에 내부 계약서를 넣어 요약해도 문제없다.",
   a:"X", t:"윤리·개인정보", why:"기밀이자 제3자 정보입니다. 통제할 수 없는 경로로 내보내는 행위이며 되돌릴 수 없습니다."},
  {q:"AI를 활용한 결과물의 오류에 대한 책임은 결국 사용한 사람과 조직에게 있다.",
   a:"O", t:"윤리·개인정보", why:"AI는 책임의 주체가 될 수 없습니다. 'AI가 그랬다'는 변명은 통하지 않습니다."},
  {q:"프롬프트에 특정 작가 이름을 넣어 만든 이미지를 상업적으로 쓰는 것은 위험하다.",
   a:"O", t:"저작권", why:"의도적 재현은 분쟁 시 매우 불리하게 작용합니다. 프롬프트 기록이 남는다는 점도 함께 고려해야 합니다."},
  {q:"공공누리 제1유형 자료는 출처를 표시하면 상업적 이용과 변형이 가능하다.",
   a:"O", t:"저작권", why:"실무에서 가장 쓰기 편한 안전지대입니다. 자료를 찾을 때 제1유형부터 확인하세요."},
  {q:"인용으로 인정받으려면 내 저작물이 '주', 인용이 '종'이어야 한다.",
   a:"O", t:"저작권", why:"주종 관계는 인용의 핵심 요건입니다. 인용이 콘텐츠의 대부분을 차지하면 인용이 아니라 복제입니다."},
  {q:"AI에게 '내가 준 자료에 없는 내용은 쓰지 말라'고 하면 환각을 줄이는 데 도움이 된다.",
   a:"O", t:"AI 리터러시", why:"실효성 있는 한 줄입니다. 다만 환각을 완전히 없애지는 못하므로 검증 절차를 대체할 수는 없습니다."},
  {q:"AI 순위 결과대로 채용 면접 대상자를 확정하는 것은 권장되는 방식이다.",
   a:"X", t:"윤리·개인정보", why:"사람의 판단 없는 결정입니다. 과거의 편향이 재생산되고 책임 주체도 사라집니다."},
  {q:"언론 기사 전문을 사내 게시판에 복사해 올리는 것은 저작권 문제가 될 수 있다.",
   a:"O", t:"저작권", why:"복제·전송에 해당할 수 있습니다. 제목과 링크 중심으로 공유하는 것이 원칙입니다."},
  {q:"판단이 애매한 회색지대에서는 스스로 결론을 내리기보다 담당 부서에 확인하는 것이 맞다.",
   a:"O", t:"윤리·개인정보", why:"오늘 교육의 결론입니다. 전문가가 되는 것이 아니라, 언제 전문가를 불러야 하는지 아는 것이 목표입니다."}
];

const LIMIT = 15;               // 문항당 제한시간(초)
const $ = id => document.getElementById(id);
const intro=$("intro"), quiz=$("quiz"), result=$("result");
const oxBtns = [...document.querySelectorAll(".ox button")];

let pool=[], idx=0, answers=[], locked=false;
let combo=0, bestCombo=0, points=0;
let tick=null, left=LIMIT, deadline=0, lastBeep=0;
let soundOn=true, timerOn=true;

/* ══ 소리 (Web Audio 합성 · 외부 파일 없음) ═══════════════ */
let AC=null;
function ac(){
  if(!AC){ const K = window.AudioContext||window.webkitAudioContext; if(!K) return null; AC=new K(); }
  if(AC.state==="suspended") AC.resume();
  return AC;
}
function note(freq, at, dur, type, vol, decay){
  const c=ac(); if(!c) return;
  const o=c.createOscillator(), g=c.createGain();
  o.type=type; o.frequency.setValueAtTime(freq, c.currentTime+at);
  g.gain.setValueAtTime(0, c.currentTime+at);
  g.gain.linearRampToValueAtTime(vol, c.currentTime+at+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime+at+dur*(decay||1));
  o.connect(g); g.connect(c.destination);
  o.start(c.currentTime+at); o.stop(c.currentTime+at+dur+0.05);
}
/* 딩 — 동 — 댕 (세 음 상행, 종소리 느낌) */
function sfxRight(){
  if(!soundOn) return;
  note(880.00, 0.00, 0.30, "sine", 0.30);   // 딩
  note(1108.7, 0.13, 0.30, "sine", 0.28);   // 동
  note(1318.5, 0.26, 0.70, "sine", 0.32);   // 댕
  note(2637.0, 0.26, 0.55, "sine", 0.07);   // 배음
}
/* 띠 — 짧고 거친 버저 */
function sfxWrong(){
  if(!soundOn) return;
  note(174, 0.00, 0.34, "square", 0.16);
  note(168, 0.00, 0.34, "square", 0.13);
}
/* 남은 시간 카운트다운 틱 */
function sfxTick(){ if(soundOn) note(1500, 0, 0.05, "square", 0.05); }
/* 콤보 상승음 */
function sfxCombo(n){
  if(!soundOn) return;
  const base = 1046.5 * Math.pow(1.0595, Math.min(n,8));
  note(base, 0.42, 0.16, "triangle", 0.16);
}
/* 결과 팡파르 */
function sfxFanfare(){
  if(!soundOn) return;
  [[523,0],[659,0.10],[784,0.20],[1046,0.32]].forEach(([f,t])=>note(f,t,0.5,"triangle",0.24));
  note(1568, 0.32, 0.9, "sine", 0.12);
}

/* ══ 폭죽 (캔버스 직접 구현) ═══════════════════════════════ */
const fx=$("fx");
let ctx=null; try{ ctx=fx.getContext("2d"); }catch(e){ ctx=null; }
const reduceMotion = () => !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
let parts=[], raf=null;
function sizeFx(){ if(!ctx) return;
  fx.width=innerWidth*devicePixelRatio; fx.height=innerHeight*devicePixelRatio;
  fx.style.width=innerWidth+"px"; fx.style.height=innerHeight+"px"; ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0); }
addEventListener("resize", sizeFx);
const PAL=["#FF4D2E","#F2A20C","#12A594","#6C4BF6","#FFFFFF","#FF8A6B"];

function burst(x,y,n){
  for(let i=0;i<n;i++){
    const ang=Math.random()*Math.PI*2, sp=1.8+Math.random()*5.4;
    parts.push({x,y, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp,
      r:1.6+Math.random()*2.6, c:PAL[(Math.random()*PAL.length)|0],
      life:1, dec:0.008+Math.random()*0.010, g:0.055, sq:Math.random()<0.35});
  }
}
function fireworks(){
  if(!ctx || reduceMotion()) return;
  sizeFx(); fx.style.display="block"; parts=[];
  const shots=[[.28,.34],[.72,.30],[.50,.22],[.18,.55],[.84,.55],[.42,.44],[.62,.50]];
  shots.forEach(([px,py],i)=>setTimeout(()=>{
    burst(innerWidth*px, innerHeight*py, 62);
    if(soundOn) note(120+Math.random()*70, 0, 0.16, "sawtooth", 0.07, 0.6);
  }, i*260));
  if(!raf) loop();
  setTimeout(()=>{ if(!parts.length){ fx.style.display="none"; } }, 5200);
}
function loop(){
  if(!ctx){ raf=null; return; }
  ctx.clearRect(0,0,innerWidth,innerHeight);
  parts = parts.filter(p=>p.life>0);
  parts.forEach(p=>{
    p.vy+=p.g; p.vx*=0.988; p.vy*=0.988;
    p.x+=p.vx; p.y+=p.vy; p.life-=p.dec;
    ctx.globalAlpha=Math.max(p.life,0); ctx.fillStyle=p.c;
    if(p.sq){ ctx.fillRect(p.x-p.r, p.y-p.r, p.r*2, p.r*2); }
    else { ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill(); }
  });
  ctx.globalAlpha=1;
  if(parts.length) raf=requestAnimationFrame(loop);
  else { raf=null; fx.style.display="none"; }
}

/* ══ 흐름 ═════════════════════════════════════════════════ */
function startQuiz(list){
  ac();                                   // 사용자 제스처 시점에 오디오 활성화
  pool=list; idx=0; answers=[]; combo=0; bestCombo=0; points=0;
  $("pts").textContent="0"; setCombo(0);
  intro.classList.add("hidden"); result.classList.add("hidden"); quiz.classList.remove("hidden");
  $("timer").classList.toggle("off", !timerOn);
  render();
}

function render(){
  const item=pool[idx];
  locked=false;
  $("qnum").textContent=idx+1;
  document.querySelector(".qcount em").textContent="/ "+pool.length;
  $("qtag").textContent=item.t; $("qtag").setAttribute("data-t", item.t);
  $("qtext").textContent=item.q;
  $("qtext").classList.remove("enter"); void $("qtext").offsetWidth; $("qtext").classList.add("enter");
  $("fill").style.width=(idx/pool.length*100)+"%";
  $("fb").className="fb"; $("next").classList.add("hidden");
  oxBtns.forEach(b=>{ b.disabled=false; b.className=""; });
  startTimer();
  window.scrollTo({top:0, behavior:"smooth"});
}

function startTimer(){
  clearInterval(tick);
  const t=$("timer");
  t.classList.remove("warn","crit");
  left=LIMIT; deadline=Date.now()+LIMIT*1000; lastBeep=LIMIT+1;
  $("tnum").textContent=LIMIT; $("tfill").style.transition="none"; $("tfill").style.width="100%";
  if(!timerOn) return;
  requestAnimationFrame(()=>{ $("tfill").style.transition="width .1s linear"; });
  tick=setInterval(()=>{
    left=Math.max(0,(deadline-Date.now())/1000);
    $("tfill").style.width=(left/LIMIT*100)+"%";
    const s=Math.ceil(left); $("tnum").textContent=s;
    t.classList.toggle("warn", left<=7 && left>4);
    t.classList.toggle("crit", left<=4);
    if(s<=3 && s>0 && s<lastBeep){ lastBeep=s; sfxTick(); }
    if(left<=0){ clearInterval(tick); answer(null); }
  }, 80);
}

function setCombo(n){
  const el=$("combo");
  if(n<2){ el.classList.remove("on","hot"); el.textContent=""; return; }
  el.textContent=n+"연속";
  el.classList.add("on");
  el.classList.toggle("hot", n>=5);
}

function answer(v){
  if(locked) return;
  locked=true; clearInterval(tick);
  const item=pool[idx];
  const timeUp = (v===null);
  const ok = !timeUp && v===item.a;
  const card=quiz;

  // 점수 : 정답 100점 + 남은 시간 보너스(최대 50) + 콤보 보너스
  let gained=0;
  if(ok){
    combo++; bestCombo=Math.max(bestCombo,combo);
    const speed = timerOn ? Math.round(left/LIMIT*50) : 25;
    gained = 100 + speed + Math.max(0,(combo-1))*20;
    points += gained;
    animatePoints(points);
    sfxRight(); if(combo>=2) sfxCombo(combo);
    card.classList.remove("flash-ok"); void card.offsetWidth; card.classList.add("flash-ok");
  } else {
    combo=0; sfxWrong();
    card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake");
  }
  setCombo(combo);
  answers.push({...item, picked: timeUp ? "—" : v, ok});

  oxBtns.forEach(b=>{
    b.disabled=true;
    const val=b.dataset.v;
    if(val===item.a) b.classList.add("right");
    else if(val===v) b.classList.add("wrong");
    else b.classList.add("dim");
  });

  $("fill").style.width=((idx+1)/pool.length*100)+"%";
  $("fb").className="fb show "+(ok?"ok":"no");
  $("verdict").textContent = ok
    ? ("딩동댕! 정답입니다" + (combo>=2 ? "  ·  "+combo+"연속" : "") + "  +"+gained+"점")
    : (timeUp ? "시간 초과 — 정답은 "+item.a : "띠! 정답은 "+item.a);
  $("why").textContent=item.why;
  $("next").textContent=(idx===pool.length-1)?"결과 보기":"다음 문제";
  $("next").classList.remove("hidden");
}

function animatePoints(target){
  const el=$("pts"); const from=parseInt(el.textContent,10)||0;
  const t0=performance.now(), dur=520;
  (function step(t){
    const p=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-p,3);
    el.textContent=Math.round(from+(target-from)*e);
    if(p<1) requestAnimationFrame(step);
  })(t0);
}

function next(){
  if(!locked) return;
  if(idx<pool.length-1){ idx++; render(); } else show();
}

function show(){
  clearInterval(tick);
  quiz.classList.add("hidden"); result.classList.remove("hidden");
  const right=answers.filter(a=>a.ok).length, total=answers.length;
  document.querySelector(".score .num small").textContent=" / "+total;

  const pct=right/total;
  let g,m;
  if(pct===1){ g="완벽합니다"; m="전 범위를 정확히 이해하셨습니다. 이제 남은 것은 이 기준을 실제 업무에 절차로 심는 일입니다."; }
  else if(pct>=.8){ g="아주 좋습니다"; m="핵심 판단 기준이 잡혀 있습니다. 틀린 문항만 다시 확인하면 충분합니다."; }
  else if(pct>=.6){ g="기본은 잡혔습니다"; m="아래 다시 볼 문항의 해설을 읽어 보세요. 특히 회색지대 문항을 눈여겨보시면 좋습니다."; }
  else { g="한 번 더 보시면 좋겠습니다"; m="틀린 문항이 특정 영역에 몰려 있는지 확인해 보세요. 그 영역의 슬라이드를 다시 보는 것이 가장 빠릅니다."; }
  $("grade").textContent=g; $("msg").textContent=m;
  $("streakLine").textContent = "최고 연속 정답 "+bestCombo+"개  ·  점수 "+points.toLocaleString()+"점";

  // 점수 카운트업
  const el=$("sc"); el.textContent="0";
  const t0=performance.now(), dur=900;
  (function step(t){
    const p=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-p,3);
    el.textContent=Math.round(right*e);
    if(p<1) requestAnimationFrame(step);
  })(t0);

  const topics=["AI 리터러시","윤리·개인정보","저작권"];
  $("bytopic").innerHTML=topics.map(t=>{
    const set=answers.filter(a=>a.t===t); if(!set.length) return "";
    const r=set.filter(a=>a.ok).length;
    const col=(r===set.length)?"var(--green)":(r/set.length>=.6?"var(--amber)":"var(--accent)");
    return `<div class="bt"><div class="t">${t}</div><div class="s" style="color:${col}">${r} / ${set.length}</div></div>`;
  }).join("");

  const miss=answers.filter(a=>!a.ok);
  $("revTitle").textContent = miss.length ? `다시 볼 문항 ${miss.length}개` : "다시 볼 문항";
  if(miss.length){
    $("misses").innerHTML=miss.map(a=>`
      <div class="miss">
        <div class="q">${a.q}</div>
        <div class="a">내 답 <i>${a.picked}</i> &nbsp;·&nbsp; 정답 <b>${a.a}</b></div>
        <div class="w">${a.why}</div>
      </div>`).join("");
    $("retry").classList.remove("hidden");
  } else {
    $("misses").innerHTML=`<div class="allright">틀린 문항이 없습니다. 오늘 배운 판단 기준을 그대로 업무에 가져가세요.</div>`;
    $("retry").classList.add("hidden");
  }

  fireworks(); sfxFanfare();
  window.scrollTo({top:0, behavior:"smooth"});
}

/* ══ 이벤트 ═══════════════════════════════════════════════ */
oxBtns.forEach(b=>b.addEventListener("click",()=>answer(b.dataset.v)));
$("start").addEventListener("click",()=>startQuiz(QUESTIONS));
$("next").addEventListener("click",next);
$("again").addEventListener("click",()=>startQuiz(QUESTIONS));
$("retry").addEventListener("click",()=>startQuiz(answers.filter(a=>!a.ok).map(a=>({q:a.q,a:a.a,t:a.t,why:a.why}))));

$("optSound").addEventListener("click",function(){ soundOn=!soundOn; this.classList.toggle("on",soundOn); if(soundOn){ac(); note(880,0,.12,"sine",.2);} });
$("optTimer").addEventListener("click",function(){ timerOn=!timerOn; this.classList.toggle("on",timerOn); });

document.addEventListener("keydown", e=>{
  const k=e.key.toLowerCase();
  if(!intro.classList.contains("hidden")){
    if(k==="enter"||k===" "){ e.preventDefault(); $("start").click(); }
    return;
  }
  if(quiz.classList.contains("hidden")) return;
  if(k==="o"||k==="ㅐ") answer("O");
  else if(k==="x"||k==="ㅌ") answer("X");
  else if(k==="enter"||k===" "||k==="arrowright"){ e.preventDefault(); next(); }
});
</script>
</body>
</html>
